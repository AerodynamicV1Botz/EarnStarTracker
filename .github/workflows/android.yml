name: Build EarnStar Tracker APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Find Gradle project folder
        id: find
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/build/*" -not -path "*/.gradle/*" | head -n 1)
          if [ -z "$f" ]; then
            f=$(find . -name settings.gradle -not -path "*/build/*" -not -path "*/.gradle/*" | head -n 1)
          fi
          if [ -z "$f" ]; then
            echo "ERROR: no settings.gradle(.kts) found in the repository"
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Gradle project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EarnStarTracker-debug-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
