name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unzip any project zip in repo root
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Unzipping $z"
            unzip -oq "$z"
          done
          echo "Repo root contents:"
          ls -la

      - name: Locate Gradle project
        id: find
        run: |
          f=$(find . -name settings.gradle.kts -not -path "*/build/*" -not -path "*/.gradle/*" | head -n 1)
          if [ -z "$f" ]; then
            f=$(find . -name settings.gradle -not -path "*/build/*" -not -path "*/.gradle/*" | head -n 1)
          fi
          if [ -z "$f" ]; then
            echo "ERROR: No project found."
            echo "Expected a file named EarnStarTracker.zip in the repo ROOT (main page)."
            echo "Files that ARE in the repo root are listed above."
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Project folder: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
